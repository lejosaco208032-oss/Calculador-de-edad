<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Edad</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <style>
        :root { --primary: #4f46e5; --bg: #f3f4f6; }
        body { font-family: sans-serif; background-color: var(--bg); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: white; padding: 2rem; border-radius: 1.5rem; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 320px; text-align: center; }
        
        .logo { font-size: 3rem; margin-bottom: 0.5rem; }
        #display { font-size: 1.5rem; font-weight: 600; margin-bottom: 0.5rem; color: #6b7280; }
        .age-display { margin: 1.5rem 0; padding: 1rem; border-radius: 1rem; background: #f9fafb; }
        .res-val { font-size: 3.5rem; font-weight: 900; color: var(--primary); display: block; line-height: 1; }
        
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        button { padding: 1.2rem; font-size: 1.2rem; border: none; border-radius: 0.8rem; background: #e5e7eb; cursor: pointer; transition: 0.2s; }
        button:active { background: #d1d5db; transform: scale(0.95); }
        .btn-clear { background: #fee2e2; color: #dc2626; grid-column: span 3; margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <div class="logo">📅</div>
    <div id="display">Año: --</div>
    <div class="age-display">
        <div style="font-size: 0.9rem; color: #6b7280;">Edad actual</div>
        <span class="res-val" id="ageOut">--</span>
        <div id="fullYear" style="font-size: 0.8rem; color: #9ca3af; margin-top: 5px;">Año detectado: --</div>
    </div>
    <div class="grid">
        <button onclick="add(1)">1</button> <button onclick="add(2)">2</button> <button onclick="add(3)">3</button>
        <button onclick="add(4)">4</button> <button onclick="add(5)">5</button> <button onclick="add(6)">6</button>
        <button onclick="add(7)">7</button> <button onclick="add(8)">8</button> <button onclick="add(9)">9</button>
        <button onclick="add(0)" style="grid-column: span 3;">0</button>
        <button class="btn-clear" onclick="limpiar()">Limpiar</button>
    </div>
</div>

<script>
    let input = "";
    function add(num) {
        if (input.length < 2) {
            input += num;
            document.getElementById('display').innerText = "Año ingresado: " + input;
            if (input.length === 2) calcular();
        }
    }
    function calcular() {
        const shortYear = parseInt(input);
        const currentYear = new Date().getFullYear();
        let fullYear = 2000 + shortYear;
        if (fullYear > currentYear) fullYear -= 100;
        document.getElementById('fullYear').innerText = "Año detectado: " + fullYear;
        document.getElementById('ageOut').innerText = currentYear - fullYear;
    }
    function limpiar() {
        input = "";
        document.getElementById('display').innerText = "Año: --";
        document.getElementById('ageOut').innerText = "--";
        document.getElementById('fullYear').innerText = "Año detectado: --";
    }
</script>
</body>
</html>
